services:
  - type: web
    name: django-library-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn library_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: "4"
